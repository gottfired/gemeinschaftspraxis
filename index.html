<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxis am Mühlbach – Gemeinschaftspraxis</title>
<meta name="description" content="Praxis am Mühlbach – unsere Gemeinschaftspraxis stellt sich vor: Lernen Sie unser Team und die Ordinationen kennen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="deco" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <svg class="leaf leaf-1" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C28 22 20 45 28 68c8 21 30 30 22 30C24 95 8 70 10 40 12 15 32 3 50 5z"/><path d="M54 3c22 10 34 30 33 52-1 20-12 38-27 44 16-14 22-38 14-62C68 14 60 7 54 3z"/></svg>
  <svg class="leaf leaf-2" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C28 22 20 45 28 68c8 21 30 30 22 30C24 95 8 70 10 40 12 15 32 3 50 5z"/><path d="M54 3c22 10 34 30 33 52-1 20-12 38-27 44 16-14 22-38 14-62C68 14 60 7 54 3z"/></svg>
</div>

<div class="page">
  <header class="hero">
    <div class="logo-ring">
      <img id="practice-logo" src="logo.png" alt="Logo der Praxis am Mühlbach" decoding="async">
    </div>
    <div class="eyebrow" id="practice-tagline">Gemeinschaftspraxis</div>
    <h1 id="practice-title">Praxis am Mühlbach</h1>
    <p class="sub" id="practice-intro">Herzlich willkommen! Lernen Sie unsere Ordinationen und unser Team kennen.</p>
  </header>

  <main class="cards" id="cards">
    <p class="loading-note" id="loading-note">Die Inhalte werden geladen …</p>
    <noscript><p class="loading-note">Bitte aktivieren Sie JavaScript, um die Ordinationen unserer Gemeinschaftspraxis anzuzeigen.</p></noscript>
  </main>

  <footer>
    <div class="ornament">✦ ✦ ✦</div>
    <div class="practice-name" id="footer-name">Praxis am Mühlbach</div>
    <div class="links" id="footer-links"></div>
  </footer>
</div>

<script>
  const cardsContainer = document.getElementById('cards');
  const loadingNote = document.getElementById('loading-note');

  const escapeHtml = (str) =>
    String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

  function render(data) {
    const p = data.practice || {};

    // Hero
    document.title = `${p.name || 'Praxis am Mühlbach'} – Gemeinschaftspraxis`;
    const logo = document.getElementById('practice-logo');
    if (p.logo) { logo.src = p.logo; logo.alt = `Logo ${p.name || 'der Praxis'}`; }
    document.getElementById('practice-tagline').textContent = p.tagline || '';
    document.getElementById('practice-title').textContent = p.name || 'Praxis am Mühlbach';
    if (p.intro) document.getElementById('practice-intro').textContent = p.intro;

    // Footer
    document.getElementById('footer-name').textContent = p.name || 'Praxis am Mühlbach';
    const footerLinks = document.getElementById('footer-links');
    footerLinks.innerHTML = '';
    (data.therapists || []).forEach((t) => {
      const a = document.createElement('a');
      a.href = t.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = t['page-title'] || t.url;
      footerLinks.appendChild(a);
    });

    // Cards
    cardsContainer.innerHTML = '';
    (data.therapists || []).forEach((t) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = t.url;
      card.target = '_blank';
      card.rel = 'noopener';

      card.innerHTML = `
        <div class="photo">
          <img src="${escapeHtml(t['practitioner-portrait'])}" alt="Porträt von ${escapeHtml(t['practitioner-name'])}" loading="lazy" decoding="async">
          <div class="accent"></div>
        </div>
        <div class="body">
          <div class="site-logo">
            <img class="icon" src="${escapeHtml(t.logo)}" alt="Logo ${escapeHtml(t['page-title'])}">
            <div class="site-text">
              <strong>${escapeHtml(t['page-title'])}</strong>
              <span>${escapeHtml(t['page-subtitle'])}</span>
            </div>
          </div>
          <h2>${escapeHtml(t['practitioner-name'])}</h2>
          <div class="role">${escapeHtml(t.subtitle)}</div>
          <p>${escapeHtml(t.text)}</p>
          <span class="cta">Zur Webseite
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
          </span>
        </div>`;

      cardsContainer.appendChild(card);
    });
  }

  fetch('therapists.json')
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch((err) => {
      loadingNote.textContent =
        'Die Inhalte konnten nicht geladen werden. Bitte öffnen Sie die Seite über einen lokalen Webserver (z. B. „python3 -m http.server“) und laden Sie sie neu.';
    });
</script>
</body>
</html>
