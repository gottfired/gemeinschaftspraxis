<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Praxis am Mühlbach – Gemeinschaftspraxis</title>
<meta name="description" content="Praxis am Mühlbach – unsere Gemeinschaftspraxis stellt sich vor: Lernen Sie unser Team und die Ordinationen kennen.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --beige: #f5f2ed;
    --beige-soft: #fcfbf9;
    --ink: #22302b;
    --ink-soft: #5e6d68;
    --green-deep: #2a443b;
    --green-mid: #446458;
    --gold: #b89d67;
    --line: rgba(42, 68, 59, 0.14);
    --shadow: 0 30px 60px -25px rgba(34, 48, 43, 0.28);
    --shadow-hover: 0 45px 90px -30px rgba(34, 48, 43, 0.38);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--beige);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* ---------- Decorative background ---------- */
  .deco {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }
  .deco .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(60px);
    opacity: 0.5;
  }
  .deco .blob-1 { width: 520px; height: 520px; background: #dbe6dd; top: -160px; left: -140px; }
  .deco .blob-2 { width: 460px; height: 460px; background: #eee6d6; bottom: -140px; right: -120px; }
  .deco .leaf {
    position: absolute;
    color: var(--green-mid);
    opacity: 0.10;
  }
  .deco .leaf-1 { top: 12%; left: 4%; transform: rotate(18deg); width: 120px; }
  .deco .leaf-2 { bottom: 14%; right: 5%; transform: rotate(-24deg) scaleX(-1); width: 150px; }

  .page { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

  /* ---------- Hero ---------- */
  .hero {
    text-align: center;
    padding: clamp(64px, 9vw, 110px) 24px 40px;
    animation: fadeDown 1s ease both;
  }
  @keyframes fadeDown { from { opacity: 0; transform: translateY(-16px); } to { opacity: 1; transform: none; } }

  .hero .logo-ring {
    /* Block statt inline-block: so bleibt der Titel darunter zentriert,
       auch bei breiten Fenstern (kein Nebeneinander mit .eyebrow) */
    display: block;
    width: fit-content;
    margin: 0 auto 34px;
    background: #f9f9f5; /* Farbton des Logos (leicht dunkler als #fff) */
    border: 1px solid rgba(42, 68, 59, 0.12);
    border-radius: 28px;
    padding: clamp(18px, 3.5vw, 34px) clamp(28px, 5vw, 56px);
    box-shadow: var(--shadow);
    transition: transform .5s cubic-bezier(.2,.7,.3,1.2);
  }
  .hero .logo-ring:hover { transform: translateY(-4px) scale(1.02); }
  .hero .logo-ring img {
    display: block;
    width: min(78vw, 420px);
    height: auto;
  }

  .hero .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--green-mid);
    margin-bottom: 20px;
  }
  .hero .eyebrow::before, .hero .eyebrow::after {
    content: "";
    width: 34px; height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold));
  }
  .hero .eyebrow::after { background: linear-gradient(90deg, var(--gold), transparent); }

  .hero h1 {
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.2rem, 5.4vw, 3.6rem);
    line-height: 1.12;
    letter-spacing: -0.01em;
    color: var(--green-deep);
    max-width: 780px;
    margin: 0 auto 18px;
  }
  .hero .sub {
    max-width: 600px;
    margin: 0 auto;
    color: var(--ink-soft);
    font-size: 1.05rem;
    font-weight: 300;
  }

  /* ---------- Cards ---------- */
  .cards {
    flex: 1;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: clamp(28px, 4vw, 56px);
    max-width: 1240px;
    margin: 0 auto;
    padding: 30px 24px 80px;
    width: 100%;
  }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    background: var(--beige-soft);
    border: 1px solid var(--line);
    border-radius: 32px;
    overflow: hidden;
    text-decoration: none;
    color: inherit;
    box-shadow: var(--shadow);
    transition: transform .45s cubic-bezier(.2,.7,.3,1), box-shadow .45s ease;
    animation: rise .9s ease both;
    --accent: var(--gold);
  }
  .card:nth-child(1) { animation-delay: .1s; }
  .card:nth-child(2) { animation-delay: .2s; }
  .card:nth-child(3) { animation-delay: .3s; }
  .card:nth-child(4) { animation-delay: .4s; }
  @keyframes rise { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: none; } }

  .card:hover { transform: translateY(-10px); box-shadow: var(--shadow-hover); }

  /* photo */
  .card .photo {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    background: var(--green-mid);
  }
  .card .photo::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(to bottom, rgba(34,48,43,0) 55%, rgba(34,48,43,0.28) 100%);
  }
  .card .photo img {
    width: 100%; height: 100%;
    object-fit: cover;
    object-position: center top;
    transition: transform .9s cubic-bezier(.2,.7,.3,1);
  }
  .card:hover .photo img { transform: scale(1.06); }

  .card .photo .accent {
    position: absolute;
    left: 22px; bottom: -1px;
    height: 5px; width: 90px;
    border-radius: 5px 5px 0 0;
    background: var(--accent);
    z-index: 2;
    transition: width .5s ease;
  }
  .card:hover .photo .accent { width: 130px; }

  /* body */
  .card .body { display: flex; flex-direction: column; padding: 30px 30px 34px; flex: 1; }

  /* website logo row */
  .card .site-logo {
    display: flex;
    align-items: center;
    gap: 14px;
    padding-bottom: 20px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--line);
  }
  .card .site-logo img.icon {
    width: 52px; height: 52px;
    object-fit: contain;
    border-radius: 12px;
    flex-shrink: 0;
  }
  .card .site-logo .site-text { display: flex; flex-direction: column; line-height: 1.25; }
  .card .site-logo .site-text strong {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    font-weight: 700;
    color: var(--green-deep);
  }
  .card .site-logo .site-text span {
    font-size: 0.82rem;
    letter-spacing: 0.02em;
    color: var(--ink-soft);
  }

  .card h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.9rem;
    font-weight: 700;
    line-height: 1.15;
    color: var(--ink);
    margin-bottom: 6px;
  }
  .card .role {
    font-size: 0.85rem;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: #8a6d3a;
    margin-bottom: 14px;
  }
  .card p {
    font-size: 0.95rem;
    font-weight: 300;
    color: var(--ink-soft);
    flex: 1;
  }

  .card .cta {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 24px;
    align-self: flex-start;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--green-deep);
    padding: 13px 26px;
    border-radius: 999px;
    border: 1.5px solid var(--green-deep);
    background: transparent;
    transition: all .35s ease;
  }
  .card .cta svg { width: 16px; height: 16px; transition: transform .35s ease; }
  .card:hover .cta {
    background: var(--green-deep);
    color: #fff;
    box-shadow: 0 12px 24px -10px rgba(42,68,59,.5);
  }
  .card:hover .cta svg { transform: translateX(4px); }

  /* ---------- Footer ---------- */
  footer {
    text-align: center;
    padding: 30px 24px 44px;
    color: var(--ink-soft);
    font-size: 0.82rem;
    font-weight: 300;
  }
  footer .ornament { color: var(--gold); letter-spacing: 6px; margin-bottom: 10px; }
  footer .practice-name { font-size: 0.9rem; color: var(--green-mid); margin-bottom: 6px; }
  footer .links a { color: var(--green-mid); text-decoration: none; }
  footer .links a:hover { text-decoration: underline; }
  footer .links a + a::before { content: " · "; color: var(--gold); }

  .loading-note {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-weight: 300;
  }

  @media (max-width: 640px) {
    .cards { padding: 16px 18px 60px; gap: 26px; }
    .card .body { padding: 24px 22px 28px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>

<div class="deco" aria-hidden="true">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <svg class="leaf leaf-1" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C28 22 20 45 28 68c8 21 30 30 22 30C24 95 8 70 10 40 12 15 32 3 50 5z"/><path d="M54 3c22 10 34 30 33 52-1 20-12 38-27 44 16-14 22-38 14-62C68 14 60 7 54 3z"/></svg>
  <svg class="leaf leaf-2" viewBox="0 0 100 100" fill="currentColor"><path d="M50 5C28 22 20 45 28 68c8 21 30 30 22 30C24 95 8 70 10 40 12 15 32 3 50 5z"/><path d="M54 3c22 10 34 30 33 52-1 20-12 38-27 44 16-14 22-38 14-62C68 14 60 7 54 3z"/></svg>
</div>

<div class="page">
  <header class="hero">
    <div class="logo-ring">
      <img id="practice-logo" src="logo.png" alt="Logo der Praxis am Mühlbach" decoding="async">
    </div>
    <div class="eyebrow" id="practice-tagline">Gemeinschaftspraxis</div>
    <h1 id="practice-title">Praxis am Mühlbach</h1>
    <p class="sub" id="practice-intro">Herzlich willkommen! Lernen Sie unsere Ordinationen und unser Team kennen.</p>
  </header>

  <main class="cards" id="cards">
    <p class="loading-note" id="loading-note">Die Inhalte werden geladen …</p>
    <noscript><p class="loading-note">Bitte aktivieren Sie JavaScript, um die Ordinationen unserer Gemeinschaftspraxis anzuzeigen.</p></noscript>
  </main>

  <footer>
    <div class="ornament">✦ ✦ ✦</div>
    <div class="practice-name" id="footer-name">Praxis am Mühlbach</div>
    <div class="links" id="footer-links"></div>
  </footer>
</div>

<script>
  const cardsContainer = document.getElementById('cards');
  const loadingNote = document.getElementById('loading-note');

  const escapeHtml = (str) =>
    String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));

  function render(data) {
    const p = data.practice || {};

    // Hero
    document.title = `${p.name || 'Praxis am Mühlbach'} – Gemeinschaftspraxis`;
    const logo = document.getElementById('practice-logo');
    if (p.logo) { logo.src = p.logo; logo.alt = `Logo ${p.name || 'der Praxis'}`; }
    document.getElementById('practice-tagline').textContent = p.tagline || '';
    document.getElementById('practice-title').textContent = p.name || 'Praxis am Mühlbach';
    if (p.intro) document.getElementById('practice-intro').textContent = p.intro;

    // Footer
    document.getElementById('footer-name').textContent = p.name || 'Praxis am Mühlbach';
    const footerLinks = document.getElementById('footer-links');
    footerLinks.innerHTML = '';
    (data.therapists || []).forEach((t) => {
      const a = document.createElement('a');
      a.href = t.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = t['page-title'] || t.url;
      footerLinks.appendChild(a);
    });

    // Cards
    cardsContainer.innerHTML = '';
    (data.therapists || []).forEach((t) => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href = t.url;
      card.target = '_blank';
      card.rel = 'noopener';

      card.innerHTML = `
        <div class="photo">
          <img src="${escapeHtml(t['practitioner-portrait'])}" alt="Porträt von ${escapeHtml(t['practitioner-name'])}" loading="lazy" decoding="async">
          <div class="accent"></div>
        </div>
        <div class="body">
          <div class="site-logo">
            <img class="icon" src="${escapeHtml(t.logo)}" alt="Logo ${escapeHtml(t['page-title'])}">
            <div class="site-text">
              <strong>${escapeHtml(t['page-title'])}</strong>
              <span>${escapeHtml(t['page-subtitle'])}</span>
            </div>
          </div>
          <h2>${escapeHtml(t['practitioner-name'])}</h2>
          <div class="role">${escapeHtml(t.subtitle)}</div>
          <p>${escapeHtml(t.text)}</p>
          <span class="cta">Zur Webseite
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M7 7h10v10"/></svg>
          </span>
        </div>`;

      cardsContainer.appendChild(card);
    });
  }

  fetch('therapists.json')
    .then((r) => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(render)
    .catch((err) => {
      loadingNote.textContent =
        'Die Inhalte konnten nicht geladen werden. Bitte öffnen Sie die Seite über einen lokalen Webserver (z. B. „python3 -m http.server“) und laden Sie sie neu.';
    });
</script>
</body>
</html>
